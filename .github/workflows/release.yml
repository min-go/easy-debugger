name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest      # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Easy Debugger ${{ github.ref_name }}'
          releaseBody: |
            各平台安装包见下方 Assets。

            - macOS: `.dmg`（Apple Silicon 与 Intel 各一个）
            - Windows: `.msi` / `.exe`
            - Linux: `.deb` / `.AppImage`

            macOS 未签名，首次打开若提示“已损坏”，在终端执行：
            `xattr -dr com.apple.quarantine "/Applications/Easy Debugger.app"`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
