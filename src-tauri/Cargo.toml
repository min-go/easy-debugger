[package]
name = "easy-debugger"
version = "2.0.0"
description = "A lightweight desktop socket debugger (TCP / UDP / WebSocket)"
authors = ["dengliming"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "easy_debugger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
encoding_rs = "0.8"
base64 = "0.22"
regex = "1"
rand = "0.9"
crc = "3"
hickory-resolver = "0.25"
if-addrs = "0.13"
tauri-plugin-os = "2.3.2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
